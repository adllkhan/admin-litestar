{% extends "base.html" %}
{% block title %}{{ spec.label }} {{ pk }}{% endblock %}
{% block content %}
<div class="bar">
  <strong>{{ spec.label }} · {{ pk }}</strong>
  {% if spec.renders("delete") %}
  <form method="post" action="{{ page_url }}/{{ pk }}/delete" style="margin-left:auto">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn--danger" type="submit">Delete</button>
  </form>
  {% endif %}
</div>
<div class="rows">
  {% for column in spec.detail_columns %}
  <div class="row">
    <span class="label">{{ column }}</span>
    <span class="mono">{{ render_value(row[column]) }}</span>
  </div>
  {% endfor %}
</div>
{% endblock %}
