{% import "_macros.html" as cells with context %}
{# Shared by the detail page and the dialog, so a record reads the same either way. #}
<div class="rows">
  {% for column in spec.detail_columns %}
  <div class="row">
    <span class="label">{{ column }}</span>
    <span class="mono">{{ cells.cell(spec, row, column, labels | default({}), admin_path, registry) }}</span>
  </div>
  {% endfor %}
</div>
