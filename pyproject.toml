[project]
name = "litestar-admin"
version = "0.1.0"
description = "Server-rendered admin for Litestar + SQLAlchemy applications"
requires-python = ">=3.10"
dependencies = [
    "litestar>=2.24.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_admin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
