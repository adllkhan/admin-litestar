name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: uv sync --all-extras --dev

      # -W error is deliberate: this package keeps its own test output clean, and a
      # deprecation from a dependency is something we want to see on CI rather than
      # discover at a major-version bump.
      - name: Test
        run: uv run pytest -q -W error

      - name: Build
        run: uv build

      - name: Check the wheel ships templates and static assets
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "admin_litestar/py.typed",
              "admin_litestar/static/admin.css",
              "admin_litestar/static/htmx.min.js",
              "admin_litestar/templates/base.html",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{wheel}: all required assets present")
          PY
