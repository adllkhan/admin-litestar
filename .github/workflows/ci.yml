name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # 3.15 is an alpha (3.15.0a2 at time of writing). The suite passes on
          # it, which is worth knowing early, but an alpha moves weekly and a
          # break there is usually not this package's fault — so it reports
          # without blocking the branch.
          - python-version: "3.15"
            experimental: true

    continue-on-error: ${{ matrix.experimental }}

    # Without this the matrix is decorative. `uv python install X` only downloads
    # that interpreter; a plain `uv sync` then picks any interpreter satisfying
    # requires-python, which measurably resolved to 3.14 on a machine where 3.10
    # had just been installed. CI would have reported four passes on 3.10-3.13
    # while testing none of them. UV_PYTHON is what actually pins sync and run.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          # This is a library, so it deliberately ships no uv.lock — pinning is
          # an application's job, and letting CI resolve fresh is what catches
          # upstream breakage. setup-uv's default cache key looks for a lockfile,
          # finds none, and warns that the cache can never be invalidated. Key it
          # on the dependency declaration instead.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "${UV_PYTHON}"

      - name: Install
        run: uv sync --dev

      - name: Confirm the interpreter is the matrix one
        run: |
          uv run python -c "
          import os, sys
          want = os.environ['UV_PYTHON']
          got = f'{sys.version_info.major}.{sys.version_info.minor}'
          sys.exit(0 if got == want else f'wanted {want}, running {got}')
          "

      # -W error is deliberate: this package keeps its own test output clean, and a
      # deprecation from a dependency is something we want to see on CI rather than
      # discover at a major-version bump.
      - name: Test
        run: uv run pytest -q -W error

      - name: Build
        run: uv build

      - name: Check the wheel ships templates and static assets
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "admin_litestar/py.typed",
              "admin_litestar/static/admin.css",
              "admin_litestar/static/htmx.min.js",
              "admin_litestar/templates/base.html",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel is missing: {missing}")
          print(f"{wheel}: all required assets present")
          PY
